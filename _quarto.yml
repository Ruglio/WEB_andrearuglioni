format:
  html:
    theme:
      light: [cosmo, assets/styles/theme_light.scss]
      dark: [cosmo, assets/styles/theme_dark.scss]
    css: assets/styles/styles.css
    code-link: true
    lightbox: true
    html-math-method: plain
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">


page-layout: full


execute: 
  freeze: auto